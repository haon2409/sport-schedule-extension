<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LOL Team Schedule Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Lịch thi đấu LOL</h1>
      <div class="header-actions" id="headerActions">
        <!-- Nút settings + clear cache được inject từ main.js -->
      </div>
    </div>

    <div class="tabs">
      <button class="tab-button active" data-tab="teams">Đội Tuyển</button>
      <button class="tab-button" data-tab="tournaments">Giải Đấu</button>
    </div>

    <div class="tab-content active" id="teams-tab">
      <div class="search-section">
        <input type="text" id="teamSearch" placeholder="Tìm kiếm đội tuyển...">
        <button type="button" id="searchButton" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Tìm
        </button>
      </div>

      <div class="teams-section">
        <div class="section-header">
          <h2>Đội đang theo dõi</h2>
          <div class="edit-controls" id="teamEditControls">
            <button type="button" id="editTeamsBtn" class="btn btn-icon" title="Sắp xếp thứ tự">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <div id="teamEditActionBtns" class="edit-action-btns">
              <button type="button" id="saveTeamsBtn" class="btn btn-icon btn-success-ghost" title="Lưu">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
              <button type="button" id="cancelTeamsBtn" class="btn btn-icon btn-danger-ghost" title="Hủy">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="followedTeams" class="teams-list"></div>
      </div>

      <div class="schedule-section">
        <h2>Lịch thi đấu</h2>
        <div id="scheduleList" class="schedule-list"></div>
      </div>
    </div>

    <div class="tab-content" id="tournaments-tab">
      <div class="search-section">
        <input type="text" id="tournamentSearch" placeholder="Tìm kiếm giải đấu...">
        <button type="button" id="tournamentSearchButton" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Tìm
        </button>
      </div>

      <div class="tournaments-section">
        <div class="section-header">
          <h2>Giải đang theo dõi</h2>
          <div class="edit-controls" id="tournamentEditControls">
            <button type="button" id="editTournamentsBtn" class="btn btn-icon" title="Sắp xếp thứ tự">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <div id="tournamentEditActionBtns" class="edit-action-btns">
              <button type="button" id="saveTournamentsBtn" class="btn btn-icon btn-success-ghost" title="Lưu">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
              <button type="button" id="cancelTournamentsBtn" class="btn btn-icon btn-danger-ghost" title="Hủy">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="followedTournaments" class="tournaments-list"></div>
      </div>

      <div class="schedule-section">
        <h2>Lịch thi đấu giải</h2>
        <div id="tournamentScheduleList" class="schedule-list"></div>
      </div>

      <div class="schedule-section">
        <h2>Bảng xếp hạng</h2>
        <div id="tournamentStandingsList" class="standings-list"></div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
