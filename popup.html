<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LOL Team Schedule Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Lịch thi đấu LOL</h1>
    
    <div class="tabs">
      <button class="tab-button active" data-tab="teams">Đội Tuyển</button>
      <button class="tab-button" data-tab="tournaments">Giải Đấu</button>
    </div>

    <div class="tab-content active" id="teams-tab">
      <div class="search-section">
        <input type="text" id="teamSearch" placeholder="Tìm kiếm đội tuyển...">
        <button id="searchButton">Tìm kiếm</button>
      </div>

      <div class="teams-section">
          <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin: 15px 0 10px 0;">
            <h2 style="margin: 0;">Đội tuyển đang theo dõi</h2>
            <div id="teamEditControls">
              <button id="editTeamsBtn" title="Chỉnh sửa thứ tự" style="background: none; border: none; cursor: pointer; font-size: 16px; padding: 0;">✏️</button>
              <div id="teamEditActionBtns" style="display: none; gap: 5px;">
                <button id="saveTeamsBtn" title="Lưu" style="background-color: #4CAF50; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px;">✔️ Lưu</button>
                <button id="cancelTeamsBtn" title="Hủy" style="background-color: #f44336; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px;">✖ Hủy</button>
              </div>
            </div>
          </div>
          <div id="followedTeams" class="teams-list">
            <!-- Danh sách đội tuyển sẽ được thêm vào đây -->
          </div>
        </div>

      <div class="schedule-section">
        <h2>Lịch thi đấu</h2>
        <div id="scheduleList" class="schedule-list">
          <!-- Lịch thi đấu sẽ được hiển thị ở đây -->
        </div>
      </div>
    </div>

    <div class="tab-content" id="tournaments-tab">
      <div class="search-section">
        <input type="text" id="tournamentSearch" placeholder="Tìm kiếm giải đấu...">
        <button id="tournamentSearchButton">Tìm kiếm</button>
      </div>

      <div class="tournaments-section">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin: 15px 0 10px 0;">
          <h2 style="margin: 0;">Giải đấu đang theo dõi</h2>
          <div id="tournamentEditControls">
            <button id="editTournamentsBtn" title="Chỉnh sửa thứ tự" style="background: none; border: none; cursor: pointer; font-size: 16px; padding: 0;">✏️</button>
            <div id="tournamentEditActionBtns" style="display: none; gap: 5px;">
              <button id="saveTournamentsBtn" title="Lưu" style="background-color: #4CAF50; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px;">✔️ Lưu</button>
              <button id="cancelTournamentsBtn" title="Hủy" style="background-color: #f44336; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 12px;">✖ Hủy</button>
            </div>
          </div>
        </div>
        <div id="followedTournaments" class="tournaments-list">
          <!-- Danh sách giải đấu sẽ được thêm vào đây -->
        </div>
      </div>

      <div class="schedule-section">
        <h2>Lịch thi đấu giải</h2>
        <div id="tournamentScheduleList" class="schedule-list">
          <!-- Lịch thi đấu sẽ được hiển thị ở đây -->
        </div>
      </div>
      
      <div class="schedule-section">
        <h2>Bảng xếp hạng</h2>
        <div id="tournamentStandingsList" class="standings-list">
          <!-- Bảng xếp hạng sẽ được hiển thị ở đây -->
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
