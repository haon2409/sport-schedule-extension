<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cài đặt — LOL Schedule Tracker</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --border: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 420px;
      margin: 40px auto;
      padding: 0 20px;
      color: var(--text);
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 13px; margin: 0 0 20px; line-height: 1.5; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      margin-top: 14px;
      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--primary-hover); }
    #status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>Cài đặt API Key</h1>
  <p>Lấy key miễn phí tại <a href="https://developers.pandascore.co/" target="_blank" rel="noopener">Pandascore Developers</a>, rồi dán vào ô bên dưới.</p>

  <label for="apiKeyInput">Pandascore API Key</label>
  <input type="text" id="apiKeyInput" placeholder="Bearer token..." autocomplete="off" spellcheck="false">

  <button type="button" id="saveBtn" class="btn">Lưu cài đặt</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
