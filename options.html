<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cài đặt API Key - LOL Team Schedule Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { width: 350px; padding: 20px; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
    input[type="text"] { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    button { padding: 8px 16px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background-color: #45a049; }
    #status { font-size: 12px; color: #1b8f3a; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Cài đặt Tiện ích</h2>
    <div class="form-group">
      <label for="apiKeyInput"><strong>Pandascore API Key:</strong></label>
      <input type="text" id="apiKeyInput" placeholder="Nhập API key của bạn...">
    </div>
    <button id="saveBtn">Lưu cài đặt</button>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
